# Écriture vers une clé USB : limiter le cache d'écriture en mémoire.
# Sans ça, Linux accepte plusieurs Go en RAM à toute vitesse (débit affiché
# trompeur au début), puis tout se fige le temps de vider le cache, y compris
# à la fin d'une capture. Avec une petite limite, le débit est régulier et
# reflète la vraie vitesse de la clé.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
